<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Life App</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; font-family: sans-serif; background: #0f172a; color: #e2e8f0; overflow: hidden; }
#lock { position: fixed; inset: 0; background: #0f172a; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; animation: fadeIn 0.8s ease; }
#lock input { padding: 14px; font-size: 18px; border-radius: 10px; border: none; width: 220px; text-align: center; margin-bottom: 12px; }
#lock button { padding: 12px 24px; font-size: 16px; border: none; border-radius: 10px; background: #2563eb; color: white; }
#lockMsg { color: #f87171; height: 20px; }
#app { position: fixed; inset: 0; display: none; flex-direction: column; animation: fadeIn 0.6s ease; }
#content { flex: 1; overflow-y: auto; padding: 16px; padding-bottom: 8px; }
h1 { font-size: 22px; text-align: center; }
.row { display: flex; gap: 8px; margin-bottom: 8px; }
.row input { flex: 1; padding: 12px; font-size: 16px; border: none; border-radius: 8px; min-width: 0; }
.addBtn { padding: 12px 16px; font-size: 16px; border: none; border-radius: 8px; background: #2563eb; color: white; }
ul { list-style: none; padding: 0; margin: 12px 0 0 0; }
li { display: flex; align-items: center; gap: 10px; background: #1e293b; padding: 12px; margin-bottom: 8px; border-radius: 10px; animation: fadeIn 0.4s ease; }
li span { flex: 1; word-break: break-word; }
li.done span { text-decoration: line-through; color: #64748b; }
.del { background: #dc2626; border: none; color: white; padding: 6px 10px; border-radius: 6px; }
nav { display: flex; justify-content: space-around; background: #1e293b; padding: 8px 2px; flex-shrink: 0; }
.tab { background: none; border: none; color: #94a3b8; text-align: center; font-size: 11px; padding: 4px 2px; transition: transform 0.3s; }
.tab.active { color: #60a5fa; transform: scale(1.1); }
.tab .name { display: block; margin-top: 4px; }
.pic { width: 40px; height: 40px; border-radius: 50%; background: #334155; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; }
.pic img { width: 100%; height: 100%; object-fit: cover; }
.empty { text-align: center; color: #64748b; margin-top: 24px; }
.total { text-align: center; font-size: 18px; margin: 12px 0; }
.msg { padding: 10px 12px; border-radius: 12px; margin-bottom: 8px; max-width: 85%; word-break: break-word; }
.msg.user { background: #2563eb; margin-left: auto; }
.msg.bot { background: #1e293b; }
#msgs { margin-top: 12px; }
.card { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 14px; animation: fadeIn 0.6s ease; }
.card h3 { margin: 0 0 8px 0; font-size: 16px; }
.bars { display: flex; align-items: flex-end; height: 120px; }
.bar { flex: 1; background: linear-gradient(#60a5fa, #2563eb); border-radius: 6px 6px 0 0; transform-origin: bottom; animation: grow 0.6s ease; }
.barLabel { display: flex; font-size: 10px; color: #94a3b8; margin-top: 4px; overflow: hidden; }
.barLabel span { flex: 1; text-align: center; white-space: nowrap; overflow: hidden; }
.range { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; margin-bottom: 10px; }
.range button { padding: 6px 10px; font-size: 12px; border: none; border-radius: 8px; background: #334155; color: white; }
.range button.on { background: #2563eb; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
@keyframes grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
</style>
</head>
<body>
<div id="lock">
  <h2>Enter password</h2>
  <input id="pw" type="password" placeholder="Password">
  <button id="unlock">Unlock</button>
  <div id="lockMsg"></div>
</div>
<div id="app">
  <div id="content"></div>
  <nav id="nav"></nav>
</div>
<script>
const PASSWORD = '1234';

const tabs = [
  { name: 'To-Do Lists', person: 'Shivaji Maharaj', img: 'https://voteforshivajijayanti.com/wp-content/uploads/2024/06/Chhatrapati-Shivaji-Maharaj-1.jpg' },
  { name: 'Reminders', person: 'Zoro', img: 'https://static.wikia.nocookie.net/glad-you-came/images/a/a2/Zoro.png/revision/latest?cb=20230710081928' },
  { name: 'CFA Study Log', person: 'Warren Buffett', img: 'https://www.givingpledge.org/wp-content/uploads/2025/03/Buffett_500x500.jpg' },
  { name: 'Expenses', person: 'Jim Rogers', img: 'https://aurumbureau.com/wp-content/uploads/2024/07/Aurum-Speakers-Bureau-Jim-Rogers.jpg' },
  { name: 'AI', person: 'Lionel Messi', img: 'https://static.dw.com/image/79570285_605.jpg' },
  { name: 'Progress', person: 'John Cena', img: 'https://hips.hearstapps.com/hmg-prod/images/john-cena-is-seen-on-the-set-of-little-brother-in-soho-on-news-photo-1763404519.pjpeg?crop=0.835xw:1.00xh;0.151xw,0&resize=640:*' }
];

const DEFAULT_AGENTS = ['CFA Questions', 'Overthinking', 'Finance & Business', 'General Assistant', 'Finance News', 'English Vocabulary'];
const MAX_EXTRA_AGENTS = 3;

const HOUR = 60 * 60 * 1000;
const DAY = 24 * HOUR;
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const RANGES = [['1 Day', 1], ['1 Week', 7], ['3 Weeks', 21], ['1 Month', 30], ['1 Year', 365], ['5 Years', 1825], ['10 Years', 3650]];

let current = 0;
const data = JSON.parse(localStorage.getItem('lifeAppData') || '{}');
const chartRange = {};

function saveData() {
  localStorage.setItem('lifeAppData', JSON.stringify(data));
}

function unlock() {
  if (document.getElementById('pw').value === PASSWORD) {
    document.getElementById('lock').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    showTab(0);
  } else {
    document.getElementById('lockMsg').textContent = 'Wrong password';
  }
}

document.getElementById('unlock').onclick = unlock;
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });

// Lock again when you leave the app
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    document.getElementById('app').style.display = 'none';
    document.getElementById('lock').style.display = 'flex';
    document.getElementById('pw').value = '';
    document.getElementById('lockMsg').textContent = '';
  }
});

function buildNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  tabs.forEach((t, i) => {
    const b = document.createElement('button');
    b.className = 'tab' + (i === current ? ' active' : '');
    b.innerHTML = '<span class="pic"><img src="' + t.img + '" alt="' + t.person + '"></span><span class="name">' + t.name + '</span>';
    b.onclick = () => showTab(i);
    nav.appendChild(b);
  });
}

function showTab(i) {
  current = i;
  buildNav();
  const c = document.getElementById('content');
  if (i === 0) renderList(c, 'todo', 'To-Do Lists', 'Add a task...');
  else if (i === 1) renderList(c, 'reminders', 'Reminders', 'Add a reminder...');
  else if (i === 2) renderStudy(c);
  else if (i === 3) renderExpenses(c);
  else if (i === 4) renderAI(c);
  else if (i === 5) renderProgress(c);
}

// ---------- Chart helpers (shared by all charts) ----------

function todayKey() {
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}

// Splits the chosen range into bars: hourly for 1 day, daily up to a month, 30-day blocks up to a year, yearly beyond
function buckets(days) {
  const now = Date.now();
  if (days <= 1) return { count: 24, size: HOUR, start: now - DAY, label: t => new Date(t).getHours() + 'h' };
  if (days <= 31) return { count: days, size: DAY, start: now - days * DAY, label: t => new Date(t).getDate() + '/' + (new Date(t).getMonth() + 1) };
  if (days <= 365) {
    const count = Math.ceil(days / 30);
    return { count, size: 30 * DAY, start: now - count * 30 * DAY, label: t => MONTHS[new Date(t).getMonth()] };
  }
  const count = Math.ceil(days / 365);
  return { count, size: 365 * DAY, start: now - count * 365 * DAY, label: t => String(new Date(t).getFullYear()) };
}

function drawBars(area, entries, days, fmt) {
  const b = buckets(days);
  const vals = new Array(b.count).fill(0);
  entries.forEach(e => {
    const i = Math.floor((e.time - b.start) / b.size);
    if (i >= 0 && i < b.count) vals[i] += e.value;
  });
  const total = vals.reduce((a, x) => a + x, 0);
  if (total === 0) {
    area.innerHTML = '<p class="empty" style="margin:0">Nothing logged in this range yet.</p>';
    return;
  }
  const max = Math.max(...vals, 1);
  const gap = b.count > 12 ? 2 : 6;
  const step = Math.ceil(b.count / 6);
  let bars = '<div class="bars" style="gap:' + gap + 'px">';
  let labels = '<div class="barLabel" style="gap:' + gap + 'px">';
  for (let i = 0; i < b.count; i++) {
    const h = vals[i] > 0 ? Math.max(4, Math.round((vals[i] / max) * 110)) : 0;
    bars += '<div class="bar" title="' + fmt(vals[i]) + '" style="height:' + h + 'px"></div>';
    labels += '<span>' + (i % step === 0 ? b.label(b.start + i * b.size) : '') + '</span>';
  }
  bars += '</div>';
  labels += '</div>';
  area.innerHTML = bars + labels + '<p class="total" style="font-size:14px">Total: ' + fmt(Math.round(total * 100) / 100) + '</p>';
}

// Puts range buttons and a chart into a box. Re-runs whenever it is mounted, so it always shows current data.
function mountChart(box, key, getEntries, fmt) {
  const idx = chartRange[key] === undefined ? 1 : chartRange[key];
  box.innerHTML = '<div class="range"></div><div class="chartArea"></div>';
  const rb = box.querySelector('.range');
  RANGES.forEach((r, i) => {
    const b = document.createElement('button');
    b.textContent = r[0];
    if (i === idx) b.classList.add('on');
    b.onclick = () => { chartRange[key] = i; mountChart(box, key, getEntries, fmt); };
    rb.appendChild(b);
  });
  drawBars(box.querySelector('.chartArea'), getEntries(), RANGES[idx][1], fmt);
}

// Data sources for the charts
const todoEntries = () => (data.todo || []).filter(t => t.doneAt).map(t => ({ time: t.doneAt, value: 1 }));
const habitEntries = () => (data.habits || []).flatMap(h =>
  Object.keys(h.days || {}).filter(k => h.days[k]).map(k => ({ time: new Date(k + 'T12:00:00').getTime(), value: 1 })));
const studyEntries = () => (data.study || []).map(s => ({ time: s.date ? new Date(s.date).getTime() : Date.now(), value: Number(s.hours) || 0 }));
const expenseEntries = () => (data.expenses || []).map(x => ({ time: x.date ? new Date(x.date).getTime() : Date.now(), value: Number(x.amount) || 0 }));

// ---------- Tabs ----------

// Checklist used by To-Do and Reminders
function renderList(c, key, title, placeholder) {
  const list = data[key] || [];
  c.innerHTML = '<h1>' + title + '</h1><form class="row" id="form"><input id="input" placeholder="' + placeholder + '" autocomplete="off"><button class="addBtn" type="submit">Add</button></form><ul id="ul"></ul>';
  const ul = document.getElementById('ul');
  if (list.length === 0) ul.innerHTML = '<li class="empty">Nothing here yet.</li>';
  list.forEach((item, i) => {
    const li = document.createElement('li');
    if (item.done) li.classList.add('done');
    const check = document.createElement('input');
    check.type = 'checkbox';
    check.checked = item.done;
    check.onchange = () => {
      list[i].done = check.checked;
      list[i].doneAt = check.checked ? Date.now() : null;
      data[key] = list; saveData();
      renderList(c, key, title, placeholder);
    };
    const span = document.createElement('span');
    span.textContent = item.text;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'X';
    del.onclick = () => { list.splice(i, 1); data[key] = list; saveData(); renderList(c, key, title, placeholder); };
    li.append(check, span, del);
    ul.appendChild(li);
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('input').value.trim();
    if (!v) return;
    list.push({ text: v, done: false, createdAt: Date.now() });
    data[key] = list; saveData();
    renderList(c, key, title, placeholder);
  });
}

// CFA study log: topic and hours, with a chart underneath
function renderStudy(c) {
  const log = data.study || [];
  const total = log.reduce((sum, s) => sum + Number(s.hours), 0);
  c.innerHTML = '<h1>CFA Study Log</h1><form class="row" id="form"><input id="topic" placeholder="Topic" autocomplete="off"><input id="hours" type="number" step="0.5" placeholder="Hours" style="max-width:90px"><button class="addBtn" type="submit">Log</button></form><div class="total">Total: ' + total + ' hours</div><ul id="ul"></ul><div class="card"><h3>Study Hours</h3><div id="chart-study"></div></div>';
  const ul = document.getElementById('ul');
  if (log.length === 0) ul.innerHTML = '<li class="empty">No study sessions yet.</li>';
  log.forEach((s, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = s.topic + ' - ' + s.hours + ' h';
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'X';
    del.onclick = () => { log.splice(i, 1); data.study = log; saveData(); renderStudy(c); };
    li.append(span, del);
    ul.appendChild(li);
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const topic = document.getElementById('topic').value.trim();
    const hours = document.getElementById('hours').value;
    if (!topic || !hours) return;
    log.push({ topic, hours, date: new Date().toISOString() });
    data.study = log; saveData();
    renderStudy(c);
  });
  mountChart(document.getElementById('chart-study'), 'study', studyEntries, v => v + ' hours');
}

// Expenses: item and amount in rupees, with a chart underneath
function renderExpenses(c) {
  const items = data.expenses || [];
  const total = items.reduce((sum, x) => sum + Number(x.amount), 0);
  c.innerHTML = '<h1>Expenses</h1><form class="row" id="form"><input id="item" placeholder="What did you spend on?" autocomplete="off"><input id="amount" type="number" placeholder="Rs" style="max-width:90px"><button class="addBtn" type="submit">Add</button></form><div class="total">Total: Rs ' + total + '</div><ul id="ul"></ul><div class="card"><h3>Spending</h3><div id="chart-exp"></div></div>';
  const ul = document.getElementById('ul');
  if (items.length === 0) ul.innerHTML = '<li class="empty">No expenses yet.</li>';
  items.forEach((x, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = x.item + ' - Rs ' + x.amount;
    const del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'X';
    del.onclick = () => { items.splice(i, 1); data.expenses = items; saveData(); renderExpenses(c); };
    li.append(span, del);
    ul.appendChild(li);
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const item = document.getElementById('item').value.trim();
    const amount = document.getElementById('amount').value;
    if (!item || !amount) return;
    items.push({ item, amount, date: new Date().toISOString() });
    data.expenses = items; saveData();
    renderExpenses(c);
  });
  mountChart(document.getElementById('chart-exp'), 'expenses', expenseEntries, v => 'Rs ' + v);
}

// AI tab: agent list
function getAgents() {
  if (!data.agents) data.agents = [...DEFAULT_AGENTS];
  return data.agents;
}

function renderAI(c) {
  const agents = getAgents();
  c.innerHTML = '<h1>AI Agents</h1><ul id="ul"></ul><form class="row" id="form"><input id="newAgent" placeholder="Add an agent (up to 3 extra)" autocomplete="off"><button class="addBtn" type="submit">Add</button></form>';
  const ul = document.getElementById('ul');
  agents.forEach((name, i) => {
    const li = document.createElement('li');
    const span = document.createElement('span');
    span.textContent = name;
    span.onclick = () => renderChat(c, i);
    li.appendChild(span);
    if (i >= DEFAULT_AGENTS.length) {
      const del = document.createElement('button');
      del.className = 'del';
      del.textContent = 'X';
      del.onclick = () => { agents.splice(i, 1); data.agents = agents; saveData(); renderAI(c); };
      li.appendChild(del);
    }
    ul.appendChild(li);
  });
  document.getElementById('form').addEventListener('submit', e => {
    e.preventDefault();
    const v = document.getElementById('newAgent').value.trim();
    if (!v) return;
    if (agents.length >= DEFAULT_AGENTS.length + MAX_EXTRA_AGENTS) {
      document.getElementById('newAgent').placeholder = 'Limit reached: 3 extra agents';
      return;
    }
    agents.push(v); data.agents = agents; saveData();
    renderAI(c);
  });
}

// AI tab: chat with one agent. Mic speech goes straight into the chat.
function renderChat(c, i) {
  const agents = getAgents();
  const name = agents[i];
  data.chats = data.chats || {};
  const msgs = data.chats[name] || [];
  c.innerHTML = '<h1>' + name + '</h1><button class="addBtn" id="back">Back</button><div id="msgs"></div><form class="row" id="chatForm"><input id="msg" placeholder="Type or tap Mic..." autocomplete="off"><button class="addBtn" type="button" id="mic">Mic</button><button class="addBtn" type="submit">Send</button></form>';

  document.getElementById('back').onclick = () => renderAI(c);

  const box = document.getElementById('msgs');
  if (msgs.length === 0) box.innerHTML = '<p class="empty">Ask something to start.</p>';
  msgs.forEach(m => {
    const d = document.createElement('div');
    d.className = 'msg ' + (m.from === 'me' ? 'user' : 'bot');
    d.textContent = m.text;
    box.appendChild(d);
  });
  box.scrollTop = box.scrollHeight;

  function sendMessage(text) {
    if (!text) return;
    msgs.push({ from: 'me', text });
    msgs.push({ from: 'bot', text: 'AI replies are not connected yet. This needs an AI service and an API key, which we will add in a later version.' });
    data.chats[name] = msgs; saveData();
    renderChat(c, i);
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  document.getElementById('mic').onclick = () => {
    if (!SR) { alert('Voice input works in Chrome on Android. Please use Chrome.'); return; }
    const rec = new SR();
    rec.lang = 'en-IN';
    rec.onresult = e => { sendMessage(e.results[0][0].transcript.trim()); };
    rec.start();
  };

  document.getElementById('chatForm').addEventListener('submit', e => {
    e.preventDefault();
    sendMessage(document.getElementById('msg').value.trim());
  });
}

// Progress tab: CFA hours, habits (with a daily tick list), and to-do completion
function renderProgress(c) {
  if (!data.habits) data.habits = [];
  c.innerHTML = '<h1>Progress</h1>' +
    '<div class="card"><h3>CFA Study Hours</h3><div id="chart-cfa"></div></div>' +
    '<div class="card"><h3>Habit Progress</h3>' +
      '<form class="row" id="habitForm"><input id="habitName" placeholder="Add a habit..." autocomplete="off"><button class="addBtn" type="submit">Add</button></form>' +
      '<ul id="habitList"></ul><div id="chart-habit"></div></div>' +
    '<div class="card"><h3>To-Do Completion</h3><div id="chart-todo"></div></div>';

  mountChart(document.getElementById('chart-cfa'), 'study', studyEntries, v => v + ' hours');
  mountChart(document.getElementById('chart-habit'), 'habit', habitEntries, v => v + ' ticks');
  mountChart(document.getElementById('chart-todo'), 'todo', todoEntries, v => v + ' done');

  // Today's habit ticks
  const habits = data.habits;
  const today = todayKey();
  const hl = document.getElementById('habitList');
  if (habits.length === 0) hl.innerHTML = '<li class="empty">Add a habit above, then tick it each day.</li>';
  habits.forEach((h,
